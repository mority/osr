<!DOCTYPE html>
<html lang="en">
<head>
    <title>Open Street Router</title>
    <meta property="og:description"
          content="Pedestrian routing, bike routing and car routing for OpenStreetMap"/>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet'
          href='https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css'/>
    <script src='https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js'></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html, body, #map {
            height: 100%;
            font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #graph-toggle, #area-toggle, #skeleton-toggle {
            position: relative;
            top: 5px;
            left: 5px;
            z-index: 1000;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            padding: 10px;
            display: flex;
            width: 28px;
            height: 28px;
            text-align: center;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: black;
            margin-bottom: 16px;
        }

        #graph-toggle, #area-toggle {
            margin-bottom: 4px;
        }

        .level {
            margin-top: 4px;
            position: relative;
            top: 5px;
            left: 5px;
            z-index: 1000;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            padding: 9.5px;
            display: flex;
            width: 28px;
            height: 28px;
            text-align: center;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: black;
            font-size: 10pt;
        }

        .active {
            background: #8fff7b;
        }

        #graph-toggle:hover, #area-toggle:hover, #skeleton-toggle:hover, .level:hover {
            background: #EEE;
        }

        .active:hover {
            background: #bdffb1;
        }

        #profile, #direction, #routing-algorithm, #foot-speed {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            text-align: center;
            text-decoration: none;
        }

        #direction {
            top: 48px;
        }

        #routing-algorithm {
            top: 91px;
        }

        #foot-speed {
            top: 134px;
        }

        #journey-info {
            color: white;
            position: absolute;
            bottom: 5px;
            left: 5px;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            text-align: center;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
        }

        .context {
            margin: 0.5em;
        }
    </style>
</head>
<body>
<a id="graph-toggle" href="#" onclick="toggleGraph()">G</a>
<a id="area-toggle" href="#" onclick="toggleAreas()" title="Cells">C</a>
<a id="skeleton-toggle" href="#" onclick="toggleSkeleton()" title="Skeleton">S</a>
<div id="levels"></div>
<select id="profile" onchange="selectProfile(event)">
    <option value="foot" selected>foot</option>
    <option value="wheelchair">wheelchair</option>
    <option value="bike">bike</option>
    <option value="bike_elevation_low">bike (low elevation)</option>
    <option value="bike_elevation_high">bike (high elevation)</option>
    <option value="car">car</option>
</select>
<select id="direction" onchange="selectDirection(event)">
    <option value="forward" selected>forward</option>
    <option value="backward">backward</option>
</select>
<select id="routing-algorithm" onchange="selectRoutingAlgorithm(event)">
    <option value="dijkstra" selected>dijkstra</option>
    <option value="bidirectional">bidirectional A*</option>
</select>
<input id="foot-speed" type="number" value="1.2" min="0.1" step="0.1"
       onchange="setSpeed(event)"/>
<div id="journey-info">
    Test
</div>
<div id="map"></div>
<script type="module">
    import {style} from "./style.js";

    // Across Alexanderplatz, Berlin (way 783052052, the ground-level plaza):
    // its two boundary connectors furthest apart, so the default route has
    // an area to cross and the area's cells show at the default level 0.
    const start = [13.4137686, 52.5201457];
    const destination = [13.4121666, 52.523808];
    const initialCenter = [13.4131949, 52.5219785];
    const query = {
        start, destination,
        max: 14400,
        profile: document.getElementById('profile').value,
        direction: document.getElementById('direction').value,
        routing: document.getElementById('routing-algorithm').value,
        footSpeed: document.getElementById('foot-speed').value
    };

    const meta = document.getElementById('journey-info');

    const updateRoute = async () => {
        try {
            const route = await getRoute();
            if (!route.error) {
                map.getSource('path').setData(route);
            }
        } catch (e) {
        }
    }

    const map = new maplibregl.Map({
        container: 'map',
        center: initialCenter,
        style: {
            version: 8,
            sources: {},
            layers: [],
        },
        zoom: 18 // level buttons only appear from zoom 18 on
    });

    const toTable = (properties) => {
        var table = document.createElement("table");
        table.classList.add("routing-graph", "properties");
        for (var key in properties) {
            var value = properties[key];
            var row = document.createElement("tr");
            var keyCell = document.createElement("td");
            keyCell.innerText = key;
            keyCell.className = "key";
            var valueCell = document.createElement("td");
            if (key == "osm_way_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href = "https://www.openstreetmap.org/way/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else if (key == "osm_relation_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href =
                    "https://www.openstreetmap.org/relation/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else if (key == "osm_node_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href =
                    "https://www.openstreetmap.org/node/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else {
                valueCell.innerText = value;
            }
            valueCell.className = "value";
            row.appendChild(keyCell);
            row.appendChild(valueCell);
            table.appendChild(row);
        }
        return table;
    }

    const getRoute = async () => {
        const response = await fetch(`${window.origin}/api/route`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                start: {
                    lat: query.start[1],
                    lng: query.start[0]
                },
                destination: {
                    lat: query.destination[1],
                    lng: query.destination[0]
                },
                profile: query.profile,
                direction: query.direction,
                max: 14400,
                routing: query.routing,
                footSpeed: parseFloat(query.footSpeed)
            })
        });
        try {
            const r = await response.json();
            const min = Math.floor(r.metadata.duration / 60);
            const sec = r.metadata.duration % 60;
            const m = Math.round(r.metadata.distance);

            meta.innerHTML = `${min} min ${sec} s<br>${m} meter`;
            return r;
        } catch (e) {
            console.log(e);
            return {
                "type": "FeatureCollection",
                "metadata": {},
                "features": []
            };
        }
    };

    const getGraph = async (bounds) => {
        const response = await fetch(`${window.origin}/api/graph`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                level: currentLevel,
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    };

    const getPlatforms = async (bounds) => {
        const response = await fetch(`${window.origin}/api/platforms`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                level: currentLevel,
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    };

    const getLevels = async (bounds) => {
        const response = await fetch(`${window.origin}/api/levels`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    }

    let graph = false;
    let currentLevel = 0;
    const levelsDom = document.getElementById('levels');
    const setLevels = async (levels) => {
        if (levels.length === 0 && currentLevel !== 0) {
            currentLevel = 0;
            graph = false;
            style(map, 0);
            await addRouting();
            await updateGraph();
            await addAreaLayers();
        }
        levelsDom.innerHTML = '';
        levels.forEach(l => {
            const levelLink = document.createElement('a');
            levelLink.href = '#';
            levelLink.textContent = `${l}`;
            levelLink.classList.add('level');
            levelLink.onclick = async () => {
                currentLevel = l;
                graph = false;
                style(map, l);
                await addRouting();
                await updateGraph();
                await addAreaLayers();
            };
            levelsDom.appendChild(levelLink);
        })
    }

    const addRouting = async () => {
        map.addSource('path', {
            type: 'geojson',
            data: await getRoute()
        });
        map.addLayer({
            'id': 'path-outline',
            'type': 'line',
            'source': 'path',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round',
            },
            'filter': [
                'all',
                ['!has', 'area'],
                ['!has', 'geodesic'],
                ['!has', 'skeleton'],
                ['any', ['!has', 'level'], ['==', 'level', currentLevel]]
            ],
            'paint': {
                'line-color': '#1966a4',
                'line-width': 7.5,
                'line-opacity': 0.8
            }
        });
        map.addLayer({
            'id': 'path',
            'type': 'line',
            'source': 'path',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round',
            },
            'filter': [
                'all',
                ['!has', 'area'],
                ['!has', 'geodesic'],
                ['!has', 'skeleton'],
                ['any', ['!has', 'level'], ['==', 'level', currentLevel]]
            ],
            'paint': {
                'line-color': '#42a5f5',
                'line-width': 5,
                'line-opacity': 0.8
            }
        });
        // Drawn bottom to top: the route (above), each area crossing as the
        // shortest walkable line, then the same crossing over the medial
        // axis, and on top the crossing as the router took it - straight
        // lines through the hubs of the cells.
        map.addLayer({
            'id': 'path-geodesic',
            'type': 'line',
            'source': 'path',
            'filter': [
                'all',
                ['has', 'geodesic'],
                ['any', ['!has', 'level'], ['==', 'level', currentLevel]]
            ],
            'layout': {'line-join': 'round', 'line-cap': 'round'},
            'paint': {'line-color': '#16a34a', 'line-width': 5, 'line-opacity': 0.85, 'line-dasharray': [2, 1]}
        });
        map.addLayer({
            'id': 'path-skeleton',
            'type': 'line',
            'source': 'path',
            'filter': [
                'all',
                ['has', 'skeleton'],
                ['any', ['!has', 'level'], ['==', 'level', currentLevel]]
            ],
            'layout': {'line-join': 'round', 'line-cap': 'round'},
            'paint': {'line-color': '#7c3aed', 'line-width': 4, 'line-opacity': 0.85, 'line-dasharray': [4, 2]}
        });
        map.addLayer({
            'id': 'path-area',
            'type': 'line',
            'source': 'path',
            'filter': [
                'all',
                ['has', 'area'],
                ['any', ['!has', 'level'], ['==', 'level', currentLevel]]
            ],
            'layout': {'line-join': 'round', 'line-cap': 'round'},
            'paint': {'line-color': '#dc2626', 'line-width': 4, 'line-dasharray': [0, 2]}
        });
    }

    const updateLevels = async () => {
        if (map.getZoom() < 18) {
            setLevels([]);
        } else {
            setLevels(await getLevels(map.getBounds()));
        }
    }

    map.on('load', async () => {
        style(map, 0);
        await updateLevels();
        await addRouting();
    });

    const updateGraph = async () => {
        if (!graphActive && graph) {
            graph = false;
            try {
                graphToggle.classList.remove('active');
                map.removeLayer('graph-geometry');
                map.removeLayer('graph-edge');
                map.removeLayer('graph-node');
                map.removeSource('graph');
            } catch (e) {
                // ignore, already removed
            }
        } else if (graphActive && !graph) {
            graph = true;
            graphToggle.classList.add('active');
            map.addSource('graph', {
                type: 'geojson',
                data: await getGraph(map.getBounds())
            });
            map.addSource('platform', {
                type: 'geojson',
                data: await getPlatforms(map.getBounds())
            })
            map.addLayer({
                'id': 'graph-geometry',
                'type': 'line',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', 'type', 'geometry'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#e55e5e',
                    'line-width': 3,
                    'line-opacity': 1
                }
            });
            map.addLayer({
                'id': 'graph-edge',
                'type': 'line',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', 'type', 'edge'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#a300d9',
                    'line-width': 3
                }
            });
            map.addLayer({
                'id': 'graph-node',
                'type': 'circle',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', '$type', 'Point']
                ],
                'paint': {
                    'circle-color': [
                        'match',
                        ['get', 'label'],
                        'unreachable', '#ff1150',
                        '#11ffaf'
                    ],
                    'circle-radius': 6,
                }
            });
            map.addLayer({
                'id': 'platform-node',
                'type': 'circle',
                'source': 'platform',
                'filter': [
                    'all',
                    ['==', '$type', 'Point']
                ],
                'paint': {
                    'circle-color': '#00d9c0',
                    'circle-radius': 10,
                }
            });
            map.addLayer({
                'id': 'platform-edge',
                'type': 'line',
                'source': 'platform',
                'filter': [
                    'all',
                    ['==', 'type', 'way'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#00d9c0',
                    'line-width': 3
                }
            });
        }
    }

    const graphToggle = document.getElementById("graph-toggle");
    let graphActive = false;
    window.toggleGraph = async () => {
        graphActive = !graphActive;
        await updateGraph();
    }

    // Area cells, from osr-area-stats --cells-out <data-dir>/area_cells.geojson
    const getAreas = async (bounds) => {
        const response = await fetch(`${window.origin}/api/areas`, {
            method: 'POST',
            mode: 'cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({waypoints: bounds.toArray().flat()})
        });
        return await response.json();
    };

    const cellColor = [
        'case', ['has', 'cell'],
        ['match', ['%', ['get', 'cell'], 8],
            0, '#e6194b', 1, '#3cb44b', 2, '#4363d8', 3, '#f58231',
            4, '#911eb4', 5, '#0fa3b1', 6, '#f032e6', 7, '#9a6324',
            '#777777'],
        '#777777'
    ];
    const statusColor = [
        'match', ['get', 'status'],
        'meshed', '#4363d8',
        'served', '#3cb44b',
        'too_big', '#e6194b',
        'unreachable_pair', '#f58231',
        '#888888'
    ];
    const areaLayers = [
        {
            id: 'area-fill', type: 'fill', filter: ['==', ['get', 'kind'], 'area'],
            paint: {'fill-color': statusColor, 'fill-opacity': 0.12}
        },
        {
            id: 'area-outline', type: 'line', filter: ['==', ['get', 'kind'], 'area'],
            paint: {'line-color': statusColor, 'line-width': 1.5}
        },
        {
            // where the cuts put each cell - drawn for looking, never routed on
            id: 'area-cell', type: 'fill', filter: ['==', ['get', 'kind'], 'cell'],
            paint: {'fill-color': cellColor, 'fill-opacity': 0.25}
        },
        {
            id: 'area-cell-outline', type: 'line', filter: ['==', ['get', 'kind'], 'cell'],
            paint: {'line-color': cellColor, 'line-width': 1.5, 'line-opacity': 0.9}
        },
        {
            id: 'area-barrier', type: 'line', filter: ['==', ['get', 'kind'], 'barrier'],
            paint: {'line-color': '#222222', 'line-width': 2, 'line-dasharray': [2, 1]}
        },
        {
            id: 'area-spoke', type: 'line', filter: ['==', ['get', 'kind'], 'spoke'],
            paint: {'line-color': cellColor, 'line-width': 2, 'line-opacity': 0.8}
        },
        {
            id: 'area-neighbour', type: 'line', filter: ['==', ['get', 'kind'], 'neighbour'],
            paint: {'line-color': '#111111', 'line-width': 3, 'line-dasharray': [1, 1]}
        },
        {
            id: 'area-connector', type: 'circle', filter: ['==', ['get', 'kind'], 'connector'],
            paint: {
                'circle-color': cellColor, 'circle-radius': 5,
                // ringed red: reaches no other connector, so no cell
                'circle-stroke-color': ['case', ['has', 'unreachable'], '#e6194b', '#ffffff'],
                'circle-stroke-width': ['case', ['has', 'unreachable'], 2.5, 1]
            }
        },
        {
            id: 'area-hub', type: 'circle', filter: ['==', ['get', 'kind'], 'hub'],
            paint: {
                'circle-color': cellColor, 'circle-radius': 8,
                'circle-stroke-color': '#111111', 'circle-stroke-width': 2
            }
        }
    ];

    // The medial axis of the same areas (osr/area/skeleton.h): the other way
    // of crossing them, on its own toggle.
    const skeletonLayers = [
        {
            id: 'area-skeleton', type: 'line', filter: ['==', ['get', 'kind'], 'skeleton'],
            paint: {'line-color': '#7c3aed', 'line-width': 2, 'line-opacity': 0.9}
        }
    ];

    const areaToggle = document.getElementById("area-toggle");
    const skeletonToggle = document.getElementById("skeleton-toggle");
    let areasActive = false;
    let skeletonActive = false;

    // An area and its cells are shown on the levels it is on. Untagged areas
    // count as ground level: shown at level 0 only, not on every floor.
    const onCurrentLevel = () => currentLevel === 0
        ? ['any', ['!', ['has', 'levels']], ['in', 0, ['get', 'levels']]]
        : ['all', ['has', 'levels'], ['in', currentLevel, ['get', 'levels']]];

    // Both toggles draw from the one source: /api/areas answers with the
    // cells and the skeleton of every area in view.
    const addLayers = async (layers) => {
        if (!map.getSource('areas')) {
            map.addSource('areas', {type: 'geojson', data: await getAreas(map.getBounds())});
        }
        layers.forEach(l => {
            if (!map.getLayer(l.id)) {
                map.addLayer({...l, source: 'areas', filter: ['all', l.filter, onCurrentLevel()]});
            }
        });
    };

    // The source goes only once nothing is drawn from it any more.
    const removeLayers = (layers) => {
        layers.forEach(l => {
            if (map.getLayer(l.id)) {
                map.removeLayer(l.id);
            }
        });
        if (!areasActive && !skeletonActive && map.getSource('areas')) {
            map.removeSource('areas');
        }
    };

    // Also called after a level change: style() replaces the whole map
    // style, which drops every source and layer added on top of it - and
    // re-adding picks up the new level.
    const addAreaLayers = async () => {
        if (areasActive) {
            await addLayers(areaLayers);
        }
        if (skeletonActive) {
            await addLayers(skeletonLayers);
        }
    };

    window.toggleAreas = async () => {
        areasActive = !areasActive;
        areaToggle.classList.toggle('active', areasActive);
        if (areasActive) {
            await addLayers(areaLayers);
        } else {
            removeLayers(areaLayers);
        }
    }

    window.toggleSkeleton = async () => {
        skeletonActive = !skeletonActive;
        skeletonToggle.classList.toggle('active', skeletonActive);
        if (skeletonActive) {
            await addLayers(skeletonLayers);
        } else {
            removeLayers(skeletonLayers);
        }
    }

    [...areaLayers, ...skeletonLayers].map(l => l.id).forEach((layer) => {
        map.on('click', layer, (e) => {
            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setDOMContent(toTable(e.features[0].properties))
                .addTo(map);
            e.originalEvent.stopPropagation();
        });
        map.on('mouseenter', layer, () => {
            map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', layer, () => {
            map.getCanvas().style.cursor = '';
        });
    });

    window.selectProfile = async (e) => {
        query.profile = e.target.value;
        map.getSource('path').setData(await getRoute());
    };

    window.selectDirection = async (e) => {
        query.direction = e.target.value;
        map.getSource('path').setData(await getRoute());
    }

    window.selectRoutingAlgorithm = async (e) => {
        query.routing = e.target.value;
        map.getSource('path').setData(await getRoute());
    }
    window.setSpeed = async (e) => {
        const speed = e.target.value;
        if (!speed) {
            console.log("Invalid speed")
            return;
        }
        if (speed < 0.1) {
            console.log(`Invalid speed ${speed} < 0.1`);
            const input = document.getElementById("foot-speed");
            input.value = "0.1";
            query.walkSpeed = "0.1";
        } else {
            query.footSpeed = speed;
        }
        map.getSource('path').setData(await getRoute());
    }

    map.on('moveend', async () => {
        if (graphActive) {
            map.getSource('graph').setData(await getGraph(map.getBounds()));
            map.getSource('platform').setData(await getPlatforms(map.getBounds()));
        }
        if (areasActive) {
            map.getSource('areas').setData(await getAreas(map.getBounds()));
        }
        updateLevels();
    });

    ['graph-node', 'graph-edge', 'graph-geometry'].forEach((layer) => {
        map.on('click', layer, (e) => {
            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setDOMContent(toTable(e.features[0].properties))
                .addTo(map);
            e.originalEvent.stopPropagation();
        });

        map.on('mouseenter', layer, () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', layer, () => {
            map.getCanvas().style.cursor = '';
        });
    });

    // Not chained through .on(): since MapLibre 5 it returns a subscription,
    // not the marker.
    const startMarker = new maplibregl.Marker({
        draggable: true,
        color: 'green'
    })
        .setLngLat(start)
        .addTo(map);
    startMarker.on('dragend', async () => {
        const x = startMarker.getLngLat();
        query.start = [x.lng, x.lat];
        query.start_level = currentLevel;
        updateRoute();
    });

    const destinationMarker = new maplibregl.Marker({
        draggable: true,
        color: 'red'
    })
        .setLngLat(destination)
        .addTo(map);
    destinationMarker.on('dragend', async () => {
        const x = destinationMarker.getLngLat();
        query.destination = [x.lng, x.lat];
        query.destination_level = currentLevel;
        updateRoute();
    });

    let popup = null;
    map.on('contextmenu', (e) => {
        if (popup != null) {
            popup.remove();
        }
        popup = new maplibregl.Popup({
            anchor: 'top-left'
        });
        const x = e.lngLat;

        const actionsDiv = document.createElement('div');
        const setStart = document.createElement('a');
        setStart.classList.add('context');
        setStart.href = '#';
        setStart.innerText = "start";
        setStart.onclick = (e) => {
            startMarker.setLngLat(x);
            query.start = [x.lng, x.lat];
            query.start_level = currentLevel;
            popup.remove();
            updateRoute();
        };
        actionsDiv.appendChild(setStart);

        const setDest = document.createElement('a');
        setDest.classList.add('context');
        setDest.href = '#';
        setDest.innerText = "destination";
        setDest.onclick = (e) => {
            destinationMarker.setLngLat(x);
            query.destination = [x.lng, x.lat];
            query.destination_level = currentLevel;
            popup.remove();
            updateRoute();
        };
        actionsDiv.appendChild(setDest);

        popup
            .setLngLat(x)
            .setDOMContent(actionsDiv)
            .addTo(map);
    });
</script>
</body>
</html>
