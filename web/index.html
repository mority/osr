<!DOCTYPE html>
<html lang="en">
<head>
    <title>Open Street Router</title>
    <meta property="og:description"
          content="Pedestrian routing, bike routing and car routing for OpenStreetMap"/>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- light and dark are handled here: no automatic darkening by the
         browser (Chrome auto dark mode) or extensions (Dark Reader) -->
    <meta name="color-scheme" content="light dark">
    <meta name="darkreader-lock">
    <link rel='stylesheet'
          href='https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css'/>
    <script src='https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js'></script>
    <style>
        :root {
            --panel-bg: #fff;
            --panel-fg: #000;
            --panel-hover: #eee;
            --active: #8fff7b;
            --active-hover: #bdffb1;
            /* keep in sync with zoneColors() */
            --meet-fill: rgba(85, 85, 85, 0.45);
            --meet-line: #222;
            --total-fill: rgba(255, 255, 255, 0.55);
            --total-line: #000;
            --legend-near: rgba(0, 0, 0, 0.6);
            --legend-far: rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --panel-bg: #2b2b2b;
                --panel-fg: #eee;
                --panel-hover: #3c3c3c;
                --active: #2e6b25;
                --active-hover: #3d8a31;
                --meet-fill: rgba(0, 0, 0, 0.55);
                --meet-line: #ddd;
                --total-fill: rgba(255, 255, 255, 0.55);
                --total-line: #fff;
                --legend-near: rgba(255, 255, 255, 0.6);
                --legend-far: rgba(255, 255, 255, 0.06);
            }
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--panel-fg);
        }

        .maplibregl-popup-content {
            color: #111;
        }

        html, body, #map {
            height: 100%;
            font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #graph-toggle {
            position: relative;
            top: 5px;
            left: 5px;
            z-index: 1000;
            background: var(--panel-bg);
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            padding: 10px;
            display: flex;
            width: 28px;
            height: 28px;
            text-align: center;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--panel-fg);
            margin-bottom: 16px;
        }

        .level {
            margin-top: 4px;
            position: relative;
            top: 5px;
            left: 5px;
            z-index: 1000;
            background: var(--panel-bg);
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            padding: 9.5px;
            display: flex;
            width: 28px;
            height: 28px;
            text-align: center;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--panel-fg);
            font-size: 10pt;
        }

        #mode-toggle {
            position: absolute;
            top: 5px;
            left: 58px;
            z-index: 1000;
            background: var(--panel-bg);
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--panel-fg);
            font-size: 10pt;
        }

        #mode-toggle:hover {
            background: var(--panel-hover);
        }

        .active {
            background: var(--active);
        }

        #graph-toggle:hover, .level:hover {
            background: var(--panel-hover);
        }

        .active:hover {
            background: var(--active-hover);
        }

        #profile, #direction, #routing-algorithm, #foot-speed {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            text-align: center;
            text-decoration: none;
        }

        #direction {
            top: 48px;
        }

        #routing-algorithm {
            top: 91px;
        }

        #foot-speed {
            top: 134px;
        }

        #cells {
            position: absolute;
            top: 177px;
            right: 5px;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            background: var(--panel-bg);
            border-radius: 3px;
            padding: 6px;
            font-size: 10pt;
            display: grid;
            grid-template-columns: auto 5em;
            gap: 4px;
            align-items: center;
        }

        #cells input {
            width: 5em;
        }

        .zone-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 3px;
            vertical-align: middle;
        }

        #cells-legend {
            grid-column: 1 / span 2;
            display: none;
        }

        #cells-legend-bar {
            height: 10px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--legend-near), var(--legend-far));
        }

        #cells-legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9pt;
        }

        #journey-info {
            color: white;
            position: absolute;
            bottom: 5px;
            left: 5px;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            text-align: center;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
        }

        .context {
            margin: 0.5em;
        }
    </style>
</head>
<body>
<a id="graph-toggle" href="#" onclick="toggleGraph()">G</a>
<a id="mode-toggle" href="#" onclick="toggleMode()"
   title="switch between start/destination routing and reach cells"></a>
<div id="levels"></div>
<select id="profile" onchange="selectProfile(event)">
    <option value="foot">foot</option>
    <option value="wheelchair">wheelchair</option>
    <option value="bike">bike</option>
    <option value="bike_elevation_low">bike (low elevation)</option>
    <option value="bike_elevation_high">bike (high elevation)</option>
    <option value="car" selected>car</option>
</select>
<select id="direction" onchange="selectDirection(event)">
    <option value="forward" selected>forward</option>
    <option value="backward">backward</option>
</select>
<select id="routing-algorithm" onchange="selectRoutingAlgorithm(event)">
    <option value="dijkstra" selected>dijkstra</option>
    <option value="bidirectional">bidirectional A*</option>
</select>
<input id="foot-speed" type="number" value="1.2" min="0.1" step="0.1"
       onchange="setSpeed(event)"/>
<div id="cells" title="right click: add source, double click marker: remove">
    <label for="cells-max">cells max [min]</label>
    <input id="cells-max" type="number" value="120" min="1" step="5"
           onchange="setCellsParam(event)"/>
    <label for="cells-size">cell size [m]</label>
    <input id="cells-size" type="number" value="500" min="10" step="50"
           onchange="setCellsParam(event)"/>
    <label for="cells-band" title="drive time bands, 0 = no shading">band [min]</label>
    <input id="cells-band" type="number" value="30" min="0" step="5"
           onchange="setCellsParam(event)"/>
    <label for="cells-meet"
           title="grey: places where the last car arrives at most this much later than at the best place (black dot)">
        <input id="cells-meet-on" type="checkbox" checked onchange="setCellsParam(event)" style="width: auto"/>
        <span class="zone-swatch" style="background: var(--meet-fill); border: 1px dashed var(--meet-line)"></span>
        meet zone + [min]</label>
    <input id="cells-meet" type="number" value="10" min="0" step="1"
           onchange="setCellsParam(event)"/>
    <label for="cells-total"
           title="white: places where the sum of all drive times is at most this much more than at the best place (white dot)">
        <input id="cells-total-on" type="checkbox" checked onchange="setCellsParam(event)" style="width: auto"/>
        <span class="zone-swatch" style="background: var(--total-fill); border: 1px dotted var(--total-line)"></span>
        total zone + [min]</label>
    <input id="cells-total" type="number" value="10" min="0" step="1"
           onchange="setCellsParam(event)"/>
    <div id="cells-legend" title="drive time from the nearest source">
        <div id="cells-legend-bar"></div>
        <div id="cells-legend-labels"><span>0 min</span><span id="cells-legend-max"></span></div>
    </div>
</div>
<div id="journey-info">
    Test
</div>
<div id="map"></div>
<script type="module">
    import {style, isDark, onThemeChange} from "./style.js";

    // Zone colors on the map, keep in sync with the --meet-*/--total-* CSS.
    const zoneColors = () => isDark()
        ? {meetFill: '#000', meetOpacity: 0.55, meetLine: '#ddd', totalFill: '#fff', totalLine: '#fff'}
        : {meetFill: '#555', meetOpacity: 0.45, meetLine: '#222', totalFill: '#fff', totalLine: '#000'};

    const start = [8.65749737, 50.10416625]
    const destination = [8.65750757, 50.10417645];
    const query = {
        start, destination,
        max: 14400,
        profile: document.getElementById('profile').value,
        direction: document.getElementById('direction').value,
        routing: document.getElementById('routing-algorithm').value,
        footSpeed: document.getElementById('foot-speed').value
    };

    const meta = document.getElementById('journey-info');

    const updateRoute = async () => {
        try {
            const route = await getRoute();
            if (!route.error) {
                map.getSource('path').setData(route);
            }
        } catch (e) {
        }
    }

    // Reach cells: every source gets the area it reaches first by car.
    const sourceColors = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
        '#42d4f4', '#f032e6', '#9a6324', '#469990', '#000075'];
    const sourceColor = (i) => sourceColors[i % sourceColors.length];
    const sourceColorExpr = ['match', ['get', 'source_idx'],
        ...sourceColors.flatMap((c, i) => [i, c]), '#888'];
    const emptyCollection = {type: 'FeatureCollection', features: []};
    const cellSources = []; // markers, index = source_idx
    let cellsRequest = 0;

    const cellsParams = () => ({
        maxMin: parseFloat(document.getElementById('cells-max').value),
        cellSize: parseFloat(document.getElementById('cells-size').value),
        bandMin: Math.max(0, parseFloat(document.getElementById('cells-band').value) || 0),
        meetMargin: document.getElementById('cells-meet-on').checked
            ? Math.max(0, parseFloat(document.getElementById('cells-meet').value) || 0)
            : null,
        totalMargin: document.getElementById('cells-total-on').checked
            ? Math.max(0, parseFloat(document.getElementById('cells-total').value) || 0)
            : null
    });

    // Bands: darker = shorter drive time. Without bands: flat fill.
    const styleCells = (data, params) => {
        const hasBands = data.features.some((f) => f.properties.kind === 'band');
        map.setFilter('cells-fill', ['==', ['get', 'kind'], hasBands ? 'band' : 'outline']);
        map.setPaintProperty('cells-fill', 'fill-opacity', hasBands
            ? ['interpolate', ['linear'], ['get', 'from_min'],
                0, 0.6, Math.max(params.maxMin - params.bandMin, 1), 0.06]
            : 0.3);
        document.getElementById('cells-legend').style.display = hasBands ? 'block' : 'none';
        document.getElementById('cells-legend-max').innerText = `${params.maxMin} min`;
    };

    const getCells = async (params) => {
        if (cellSources.length === 0) {
            return emptyCollection;
        }
        const response = await fetch(`${window.origin}/api/cells`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                sources: cellSources.map((m) => ({
                    lat: m.getLngLat().lat,
                    lng: m.getLngLat().lng
                })),
                profile: 'car',
                max: Math.round(params.maxMin * 60),
                cellSize: params.cellSize,
                bandMinutes: params.bandMin,
                meetMarginMinutes: params.meetMargin,
                totalMarginMinutes: params.totalMargin
            })
        });
        const r = await response.json();
        if (r.error) {
            console.log(r.error);
            return emptyCollection;
        }
        return r;
    };

    const updateCells = async () => {
        const id = ++cellsRequest;
        const params = cellsParams();
        const data = await getCells(params);
        if (id === cellsRequest && map.getSource('cells')) {
            map.getSource('cells').setData(data);
            styleCells(data, params);
        }
    };

    const createCellSource = (lngLat, i) => {
        const marker = new maplibregl.Marker({
            draggable: true,
            color: sourceColor(i)
        })
            .setLngLat(lngLat)
            .addTo(map)
            .on('dragend', updateCells);
        marker.getElement().addEventListener('dblclick', (e) => {
            e.stopPropagation();
            removeCellSource(marker);
        });
        return marker;
    };

    const addCellSource = (lngLat) => {
        cellSources.push(createCellSource(lngLat, cellSources.length));
        updateCells();
    };

    // Re-create the remaining markers so the colors match the new indices.
    const removeCellSource = (marker) => {
        const positions = cellSources.filter((m) => m !== marker)
            .map((m) => m.getLngLat());
        cellSources.splice(0).forEach((m) => m.remove());
        positions.forEach((p, i) => cellSources.push(createCellSource(p, i)));
        updateCells();
    };

    window.setCellsParam = () => updateCells();

    const addCells = async () => {
        const params = cellsParams();
        const data = await getCells(params);
        map.addSource('cells', {
            type: 'geojson',
            data
        });
        map.addLayer({
            'id': 'cells-fill',
            'type': 'fill',
            'source': 'cells',
            'paint': {
                'fill-color': sourceColorExpr,
                'fill-opacity': 0.3
            }
        });
        map.addLayer({
            'id': 'cells-outline',
            'type': 'line',
            'source': 'cells',
            'layout': {
                'line-join': 'round'
            },
            'filter': ['==', ['get', 'kind'], 'outline'],
            'paint': {
                'line-color': sourceColorExpr,
                'line-width': 2,
                'line-opacity': 0.9
            }
        });
        map.addLayer({
            'id': 'meet-zone-fill',
            'type': 'fill',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'meet_zone'],
            'paint': {
                'fill-color': zoneColors().meetFill,
                'fill-opacity': zoneColors().meetOpacity
            }
        });
        map.addLayer({
            'id': 'meet-zone-line',
            'type': 'line',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'meet_zone'],
            'layout': {
                'line-join': 'round'
            },
            'paint': {
                'line-color': zoneColors().meetLine,
                'line-width': 1.5,
                'line-dasharray': [2, 1]
            }
        });
        map.addLayer({
            'id': 'total-zone-fill',
            'type': 'fill',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'total_zone'],
            'paint': {
                'fill-color': zoneColors().totalFill,
                'fill-opacity': 0.55
            }
        });
        map.addLayer({
            'id': 'total-zone-line',
            'type': 'line',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'total_zone'],
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': zoneColors().totalLine,
                'line-width': 2,
                'line-dasharray': [0.1, 2]
            }
        });
        map.addLayer({
            'id': 'meet-point',
            'type': 'circle',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'meet_point'],
            'paint': {
                'circle-color': '#000',
                'circle-radius': 7,
                'circle-stroke-color': '#fff',
                'circle-stroke-width': 2
            }
        });
        map.addLayer({
            'id': 'total-point',
            'type': 'circle',
            'source': 'cells',
            'filter': ['==', ['get', 'kind'], 'total_point'],
            'paint': {
                'circle-color': '#fff',
                'circle-radius': 7,
                'circle-stroke-color': '#000',
                'circle-stroke-width': 2
            }
        });
        styleCells(data, params);
    };

    // Mode: 'route' (start/destination query) or 'cells' (reach cells).
    let mode = 'route';
    const routeControls = ['profile', 'direction', 'routing-algorithm',
        'foot-speed', 'journey-info'].map((id) => document.getElementById(id));
    const cellsControls = [document.getElementById('cells')];
    const routeLayers = ['path-outline', 'path'];
    const cellsLayers = ['cells-fill', 'cells-outline', 'meet-zone-fill',
        'meet-zone-line', 'total-zone-fill', 'total-zone-line', 'meet-point',
        'total-point'];

    const applyMode = () => {
        const isRoute = mode === 'route';
        document.getElementById('mode-toggle').innerText =
            isRoute ? 'mode: route' : 'mode: cells';
        routeControls.forEach((el) => el.style.display = isRoute ? '' : 'none');
        cellsControls.forEach((el) => el.style.display = isRoute ? 'none' : '');
        [startMarker, destinationMarker].forEach(
            (m) => m.getElement().style.display = isRoute ? '' : 'none');
        cellSources.forEach(
            (m) => m.getElement().style.display = isRoute ? 'none' : '');
        const setVisible = (layers, visible) => layers.forEach((l) => {
            if (map.getLayer(l)) {
                map.setLayoutProperty(l, 'visibility', visible ? 'visible' : 'none');
            }
        });
        setVisible(routeLayers, isRoute);
        setVisible(cellsLayers, !isRoute);
    };

    window.toggleMode = () => {
        mode = mode === 'route' ? 'cells' : 'route';
        if (popup != null) {
            popup.remove();
        }
        applyMode();
    };

    const map = new maplibregl.Map({
        container: 'map',
        center: start,
        style: {
            version: 8,
            sources: {},
            layers: [],
        },
        zoom: 18
    });

    const toTable = (properties) => {
        var table = document.createElement("table");
        table.classList.add("routing-graph", "properties");
        for (var key in properties) {
            var value = properties[key];
            var row = document.createElement("tr");
            var keyCell = document.createElement("td");
            keyCell.innerText = key;
            keyCell.className = "key";
            var valueCell = document.createElement("td");
            if (key == "osm_way_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href = "https://www.openstreetmap.org/way/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else if (key == "osm_relation_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href =
                    "https://www.openstreetmap.org/relation/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else if (key == "osm_node_id" && value != 0) {
                var osmLink = document.createElement("a");
                osmLink.href =
                    "https://www.openstreetmap.org/node/" + Math.abs(value);
                osmLink.target = "_blank";
                osmLink.innerText = value;
                valueCell.appendChild(osmLink);
            } else {
                valueCell.innerText = value;
            }
            valueCell.className = "value";
            row.appendChild(keyCell);
            row.appendChild(valueCell);
            table.appendChild(row);
        }
        return table;
    }

    const getRoute = async () => {
        const response = await fetch(`${window.origin}/api/route`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                start: {
                    lat: query.start[1],
                    lng: query.start[0]
                },
                destination: {
                    lat: query.destination[1],
                    lng: query.destination[0]
                },
                profile: query.profile,
                direction: query.direction,
                max: 14400,
                routing: query.routing,
                footSpeed: parseFloat(query.footSpeed)
            })
        });
        try {
            const r = await response.json();
            const min = Math.floor(r.metadata.duration / 60);
            const sec = r.metadata.duration % 60;
            const m = Math.round(r.metadata.distance);

            meta.innerHTML = `${min} min ${sec} s<br>${m} meter`;
            return r;
        } catch (e) {
            console.log(e);
            return {
                "type": "FeatureCollection",
                "metadata": {},
                "features": []
            };
        }
    };

    const getGraph = async (bounds) => {
        const response = await fetch(`${window.origin}/api/graph`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                level: currentLevel,
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    };

    const getPlatforms = async (bounds) => {
        const response = await fetch(`${window.origin}/api/platforms`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                level: currentLevel,
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    };

    const getLevels = async (bounds) => {
        const response = await fetch(`${window.origin}/api/levels`, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Access-Control-Allow-Origin': '*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                waypoints: bounds.toArray().flat()
            })
        });
        return await response.json();
    }

    let graph = false;
    let currentLevel = 0;
    const levelsDom = document.getElementById('levels');
    const setLevels = async (levels) => {
        if (levels.length === 0 && currentLevel !== 0) {
            currentLevel = 0;
            graph = false;
            style(map, 0);
            await addCells();
            await addRouting();
            await updateGraph();
        }
        levelsDom.innerHTML = '';
        levels.forEach(l => {
            const levelLink = document.createElement('a');
            levelLink.href = '#';
            levelLink.textContent = `${l}`;
            levelLink.classList.add('level');
            levelLink.onclick = async () => {
                currentLevel = l;
                graph = false;
                style(map, l);
                await addCells();
                await addRouting();
                await updateGraph();
            };
            levelsDom.appendChild(levelLink);
        })
    }

    const addRouting = async () => {
        map.addSource('path', {
            type: 'geojson',
            data: await getRoute()
        });
        map.addLayer({
            'id': 'path-outline',
            'type': 'line',
            'source': 'path',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round',
            },
            'filter': [
                'any',
                ['!has', 'level'],
                ['==', 'level', currentLevel]
            ],
            'paint': {
                'line-color': '#1966a4',
                'line-width': 7.5,
                'line-opacity': 0.8
            }
        });
        map.addLayer({
            'id': 'path',
            'type': 'line',
            'source': 'path',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round',
            },
            'filter': [
                'any',
                ['!has', 'level'],
                ['==', 'level', currentLevel]
            ],
            'paint': {
                'line-color': '#42a5f5',
                'line-width': 5,
                'line-opacity': 0.8
            }
        });
        applyMode();
    }

    const updateLevels = async () => {
        if (map.getZoom() < 18) {
            setLevels([]);
        } else {
            setLevels(await getLevels(map.getBounds()));
        }
    }

    // Light/dark map style follows the system theme.
    onThemeChange(async () => {
        style(map, currentLevel);
        await addCells();
        await addRouting();
        graph = false;
        await updateGraph();
    });

    map.on('load', async () => {
        style(map, 0);
        await updateLevels();
        await addCells();
        await addRouting();
    });

    const updateGraph = async () => {
        if (!graphActive && graph) {
            graph = false;
            try {
                graphToggle.classList.remove('active');
                map.removeLayer('graph-geometry');
                map.removeLayer('graph-edge');
                map.removeLayer('graph-node');
                map.removeSource('graph');
            } catch (e) {
                // ignore, already removed
            }
        } else if (graphActive && !graph) {
            graph = true;
            graphToggle.classList.add('active');
            map.addSource('graph', {
                type: 'geojson',
                data: await getGraph(map.getBounds())
            });
            map.addSource('platform', {
                type: 'geojson',
                data: await getPlatforms(map.getBounds())
            })
            map.addLayer({
                'id': 'graph-geometry',
                'type': 'line',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', 'type', 'geometry'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#e55e5e',
                    'line-width': 3,
                    'line-opacity': 1
                }
            });
            map.addLayer({
                'id': 'graph-edge',
                'type': 'line',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', 'type', 'edge'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#a300d9',
                    'line-width': 3
                }
            });
            map.addLayer({
                'id': 'graph-node',
                'type': 'circle',
                'source': 'graph',
                'filter': [
                    'all',
                    ['==', '$type', 'Point']
                ],
                'paint': {
                    'circle-color': [
                        'match',
                        ['get', 'label'],
                        'unreachable', '#ff1150',
                        '#11ffaf'
                    ],
                    'circle-radius': 6,
                }
            });
            map.addLayer({
                'id': 'platform-node',
                'type': 'circle',
                'source': 'platform',
                'filter': [
                    'all',
                    ['==', '$type', 'Point']
                ],
                'paint': {
                    'circle-color': '#00d9c0',
                    'circle-radius': 10,
                }
            });
            map.addLayer({
                'id': 'platform-edge',
                'type': 'line',
                'source': 'platform',
                'filter': [
                    'all',
                    ['==', 'type', 'way'],
                    [
                        'any',
                        ['!has', 'level'],
                        ['==', 'level', currentLevel]
                    ]
                ],
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                'paint': {
                    'line-color': '#00d9c0',
                    'line-width': 3
                }
            });
        }
    }

    const graphToggle = document.getElementById("graph-toggle");
    let graphActive = false;
    window.toggleGraph = async () => {
        graphActive = !graphActive;
        await updateGraph();
    }

    window.selectProfile = async (e) => {
        query.profile = e.target.value;
        map.getSource('path').setData(await getRoute());
    };

    window.selectDirection = async (e) => {
        query.direction = e.target.value;
        map.getSource('path').setData(await getRoute());
    }

    window.selectRoutingAlgorithm = async (e) => {
        query.routing = e.target.value;
        map.getSource('path').setData(await getRoute());
    }
    window.setSpeed = async (e) => {
        const speed = e.target.value;
        if (!speed) {
            console.log("Invalid speed")
            return;
        }
        if (speed < 0.1) {
            console.log(`Invalid speed ${speed} < 0.1`);
            const input = document.getElementById("foot-speed");
            input.value = "0.1";
            query.walkSpeed = "0.1";
        } else {
            query.footSpeed = speed;
        }
        map.getSource('path').setData(await getRoute());
    }

    map.on('moveend', async () => {
        if (graphActive) {
            map.getSource('graph').setData(await getGraph(map.getBounds()));
            map.getSource('platform').setData(await getPlatforms(map.getBounds()));
        }
        updateLevels();
    });

    ['graph-node', 'graph-edge', 'graph-geometry'].forEach((layer) => {
        map.on('click', layer, (e) => {
            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setDOMContent(toTable(e.features[0].properties))
                .addTo(map);
            e.originalEvent.stopPropagation();
        });

        map.on('mouseenter', layer, () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', layer, () => {
            map.getCanvas().style.cursor = '';
        });
    });

    // Meeting points: drive time of each source.
    const showMeetPopup = (e, title) => {
        const props = e.features[0].properties;
        // GeoJSON source properties arrive JSON-encoded for arrays
        const perSource = typeof props.per_source_min === 'string'
            ? JSON.parse(props.per_source_min) : props.per_source_min;
        const div = document.createElement('div');
        const head = document.createElement('b');
        head.innerText = title;
        div.appendChild(head);
        const summary = document.createElement('div');
        summary.innerText = `last arrival: ${Math.round(props.latest_min)} min, ` +
            `total: ${Math.round(props.total_min)} min`;
        div.appendChild(summary);
        perSource.forEach((m, i) => {
            const row = document.createElement('div');
            const dot = document.createElement('span');
            dot.style.cssText = `display:inline-block;width:10px;height:10px;` +
                `border-radius:5px;margin-right:6px;background:${sourceColor(i)}`;
            row.appendChild(dot);
            row.appendChild(document.createTextNode(`${Math.round(m)} min`));
            div.appendChild(row);
        });
        new maplibregl.Popup().setLngLat(e.lngLat).setDOMContent(div).addTo(map);
        e.originalEvent.stopPropagation();
    };
    [['meet-point', 'earliest last arrival'],
        ['total-point', 'smallest total drive time']].forEach(([layer, title]) => {
        map.on('click', layer, (e) => showMeetPopup(e, title));
        map.on('mouseenter', layer, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', layer, () => map.getCanvas().style.cursor = '');
    });

    const startMarker = new maplibregl.Marker({
        draggable: true,
        color: 'green'
    })
        .setLngLat(start)
        .addTo(map)
        .on('dragend', async () => {
            const x = startMarker.getLngLat();
            query.start = [x.lng, x.lat];
            query.start_level = currentLevel;
            updateRoute();
        });

    const destinationMarker = new maplibregl.Marker({
        draggable: true,
        color: 'red'
    })
        .setLngLat(destination)
        .addTo(map)
        .on('dragend', async () => {
            const x = destinationMarker.getLngLat();
            query.destination = [x.lng, x.lat];
            query.destination_level = currentLevel;
            updateRoute();
        });

    let popup = null;
    map.on('contextmenu', (e) => {
        if (popup != null) {
            popup.remove();
        }
        popup = new maplibregl.Popup({
            anchor: 'top-left'
        });
        const x = e.lngLat;

        const actionsDiv = document.createElement('div');
        if (mode === 'cells') {
            addCellsActions(actionsDiv, x);
        } else {
            addRouteActions(actionsDiv, x);
        }

        popup
            .setLngLat(x)
            .setDOMContent(actionsDiv)
            .addTo(map);
    });

    const addRouteActions = (actionsDiv, x) => {
        const setStart = document.createElement('a');
        setStart.classList.add('context');
        setStart.href = '#';
        setStart.innerText = "start";
        setStart.onclick = (e) => {
            startMarker.setLngLat(x);
            query.start = [x.lng, x.lat];
            query.start_level = currentLevel;
            popup.remove();
            updateRoute();
        };
        actionsDiv.appendChild(setStart);

        const setDest = document.createElement('a');
        setDest.classList.add('context');
        setDest.href = '#';
        setDest.innerText = "destination";
        setDest.onclick = (e) => {
            destinationMarker.setLngLat(x);
            query.destination = [x.lng, x.lat];
            query.destination_level = currentLevel;
            popup.remove();
            updateRoute();
        };
        actionsDiv.appendChild(setDest);
    };

    const addCellsActions = (actionsDiv, x) => {
        const addSource = document.createElement('a');
        addSource.classList.add('context');
        addSource.href = '#';
        addSource.innerText = "add source";
        addSource.onclick = (e) => {
            popup.remove();
            addCellSource(x);
        };
        actionsDiv.appendChild(addSource);

        if (cellSources.length !== 0) {
            const clearSources = document.createElement('a');
            clearSources.classList.add('context');
            clearSources.href = '#';
            clearSources.innerText = "clear sources";
            clearSources.onclick = (e) => {
                popup.remove();
                cellSources.splice(0).forEach((m) => m.remove());
                updateCells();
            };
            actionsDiv.appendChild(clearSources);
        }
    };

    applyMode();
</script>
</body>
</html>
